name = "lunara-backup"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Create the bucket first:  wrangler r2 bucket create lunara-backups
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "lunara-backups"

# Per-IP write-rate counters (fixed hourly window), keyed as ratelimit:put:<ip>:<window>.
# Create with:  wrangler kv namespace create RATE_LIMITS
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "REPLACE_WITH_KV_ID"

[vars]
# Comma-separated origins allowed to call this relay (your deployed app URLs).
ALLOWED_ORIGINS = "https://lunara.app,http://localhost:5173"
# Reject blobs larger than this many bytes (a period history is tiny).
MAX_BLOB_BYTES = "5242880"
# Max PUTs a single IP may make per rolling hour before getting 429s.
MAX_PUTS_PER_IP_PER_HOUR = "20"
